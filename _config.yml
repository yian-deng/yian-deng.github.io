# Basic Information
title: Yian Deng
position: Senior Research Engineer
affiliation: Beijing Institute for General Artificial Intelligence (BIGAI)
affiliation_link: https://www.bigai.ai/
email: dengyian@bigai.ai

# Search Engine Optimization (SEO)
# The following information is used to improve the website traffic from search engines, e.g., Google.
keywords: Cognitive Planning, Robotics, Computer Vision, Adversarial Learning, Reinforcement Learning  
description: Personal academic homepage of Yian Deng, Senior Research Engineer at BIGAI, working on agent planning, embodied intelligence, robotics, and reinforcement learning.
canonical: https://yian-deng.github.io/

# Links
# If you don't need one of them, you may delete the corresponding line.
google_scholar: https://scholar.google.com/citations?user=WjDIAUIAAAAJ&hl=zh-CN
alphaxiv: https://www.alphaxiv.org/@yian-deng

# Images (e.g., your profile picture and your website's favicon)
# "favicon" and "favicon_dark" are used for the light and dark modes, respectively.
avatar: ./assets/img/avatar.png
favicon: ./assets/img/favicon.png
favicon_dark: ./assets/img/favicon-dark.png

# Footnote
# You may use this option to disable the footnote, "Powered by Jekyll and Minimal Light theme."
enable_footnote: true

# Auto Dark Mode
# You may use this option to disable the automatic dark theme.
auto_dark_mode: true

# Font
# You may use this option to choose between Serif and Sans Serif fonts.
font: "Serif" # or "Sans Serif"

# Google Analytics ID
# Uncomment the line below and fill in your Google Analytics 4 measurement ID (G-XXXXXXXXXX) to enable it.
# google_analytics: G-XXXXXXXXXX

# Use this project as a remote theme for GitHub Pages
# See the guide here: https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
remote_theme: yaoyao-liu/minimal-light

# The following files will be removed from the generated website.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README_zh_Hans.md
  - README_zh_Hant.md
  - README_de.md
  - LICENSE
  - minimal-light.gemspec
  - html_source_file/

plugins:
  - jekyll-sitemap
